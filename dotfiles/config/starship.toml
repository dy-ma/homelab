add_newline = false
command_timeout = 1000

format = """\
$username\
$hostname\
$directory\
$git_branch\
$git_status\
$cmd_duration\
$line_break\
$character"""

[username]
show_always = true
style_user = "bold blue"
format = "[$user]($style)"

[hostname]
ssh_only = false
style = "bold blue"
format = "[@$hostname]($style) "
trim_at = "."

[directory]
style = "bold cyan"
truncation_length = 4
truncate_to_repo = false
format = "[$path]($style) "

[git_branch]
symbol = "git:"
style = "bold purple"
format = "[on $symbol$branch]($style) "

[git_status]
style = "bold yellow"
format = "([$all_status$ahead_behind]($style) )"
conflicted = "conflict:${count} "
ahead = "ahead:${count} "
behind = "behind:${count} "
diverged = "diverged:${ahead_count}/${behind_count} "
untracked = "untracked:${count} "
stashed = "stash:${count} "
modified = "modified:${count} "
staged = "staged:${count} "
renamed = "renamed:${count} "
deleted = "deleted:${count} "

[cmd_duration]
min_time = 2000
style = "dimmed white"
format = "[took $duration]($style) "

[character]
success_symbol = "[❯](bold green) "
error_symbol = "[❯](bold red) "
